<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FPV Build Planner</title>
  <meta name="description" content="Pick FPV drone parts, check compatibility, see all-up weight, thrust-to-weight, flight time and payload, and compare prices across FPV stores.">
  <meta name="theme-color" content="#0b0f14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img src="assets/icons/icon.svg" alt="" width="28" height="28">
      <h1>FPV Build Planner</h1>
    </div>
    <div id="status-pill" aria-live="polite"></div>
  </header>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <main id="view"><div class="card empty"><p>Loading parts…</p></div></main>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="update-bar" class="update-bar" hidden>
    <span>A new version of the app is ready.</span>
    <button id="apply-update" class="btn small">Reload</button>
  </div>
  <noscript><p class="card">This app needs JavaScript.</p></noscript>
</body>
</html>
