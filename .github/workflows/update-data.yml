name: Update prices and catalog

on:
  schedule:
    - cron: "17 7 1 * *" # 07:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh store prices and catalog
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parts.json data/catalog.json data/meta.json
          git commit -m "Monthly price + catalog update ($(date -u +%Y-%m-%d))"
          # main may have moved while the job ran: rebase onto it and retry.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
